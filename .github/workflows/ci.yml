name: Analytics Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA; the comment names the release.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.14 (matches the local project venv)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.4"

      - name: Validate required files and repository guardrails
        run: |
          bash scripts/validate_required_files.sh

      - name: Guard against committed local paths and secrets
        run: |
          set -euo pipefail
          status=0

          # Files written by local runs before this guard existed; Step 12
          # removes their local paths, then this exclusion list goes away.
          known_local_path_files=(
            ':(exclude)logs/point_in_time_fact_join_report.json'
            ':(exclude)logs/scd2_gold_mart_report.json'
            ':(exclude)logs/scd2_quality_report.json'
            ':(exclude)docs/warehouse/airflow_working_state.md'
          )

          if git grep -nIE '/home/[A-Za-z0-9_.-]+/|/Users/[A-Za-z0-9_.-]+/|Desktop/p2-notes' \
              -- . ':(exclude).github/workflows/ci.yml' "${known_local_path_files[@]}"; then
            echo "::error::Local machine path committed (see lines above)."
            status=1
          fi

          if git grep -nIE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'AKIA[0-9A-Z]{16}' \
              -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Private key or AWS access key committed (see lines above)."
            status=1
          fi

          if git ls-files | grep -E '(^|/)\.env$|^dbt/profiles\.yml$|^dbt/(target|dbt_packages)/'; then
            echo "::error::Runtime credential or dbt build file is tracked (see paths above)."
            status=1
          fi

          exit "$status"

      - name: Compile Python source files
        run: |
          set -euo pipefail

          python -m compileall -q \
            data-generator \
            spark-batch \
            scripts \
            sql \
            airflow/dags

      - name: Validate shell scripts
        run: |
          set -euo pipefail

          shopt -s nullglob
          scripts_found=0

          for script_path in scripts/*.sh; do
            scripts_found=1
            test -s "$script_path" || {
              echo "Empty shell script: $script_path"
              exit 1
            }
            bash -n "$script_path"
          done

          test "$scripts_found" -eq 1 || {
            echo "No shell scripts found under scripts/"
            exit 1
          }

      - name: Validate warehouse SQL assets and function references
        run: |
          python scripts/validate_sql_assets.py

      - name: Static-check Airflow DAG definition
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import ast
          import sys

          dag_path = Path("airflow/dags/batch_lakehouse_pipeline.py")
          source = dag_path.read_text(encoding="utf-8")

          errors = []

          try:
              tree = ast.parse(source, filename=str(dag_path))
          except SyntaxError as exc:
              print(exc)
              sys.exit(1)

          if "batch_lakehouse_marketing_analytics" not in source:
              errors.append("Expected DAG id text not found: batch_lakehouse_marketing_analytics")

          airflow_markers = ("DAG", "dag", "BashOperator", "PythonOperator", "EmptyOperator")
          if not any(marker in source for marker in airflow_markers):
              errors.append("No obvious Airflow DAG/operator marker found.")

          assigned_names = [
              node.targets[0].id
              for node in ast.walk(tree)
              if isinstance(node, ast.Assign)
              and node.targets
              and isinstance(node.targets[0], ast.Name)
          ]

          if not assigned_names:
              errors.append("No assigned task-like objects found in DAG file.")

          if errors:
              print("Airflow static validation failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("Airflow DAG source validation passed.")
          PY

      # dbt-core 1.10 / dbt-postgres 1.10 support Python up to 3.13, so the
      # dev tools (ruff, pytest, dbt) are installed into a 3.13 environment.
      - name: Set up Python 3.13 for the dev tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.18"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: |
          set -euo pipefail

          python -m pip install -r requirements-dev.txt
          ruff --version
          dbt --version

      - name: Ruff (syntax errors and undefined names)
        run: |
          ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Validate dbt project structure
        run: |
          set -euo pipefail

          test -s dbt/dbt_project.yml
          test -s dbt/profiles.yml.example
          test -s dbt/models/schema.yml
          test -s dbt/models/exposures.yml
          test -d dbt/models/staging
          test -d dbt/models/warehouse
          test -d dbt/models/marts
          test -d dbt/models/audit

      - name: dbt parse
        run: |
          set -euo pipefail

          cd dbt
          cp profiles.yml.example profiles.yml
          dbt parse --profiles-dir . --no-partial-parse

      - name: Remove dbt runtime files from CI workspace
        if: always()
        run: |
          rm -rf dbt/target dbt/dbt_packages dbt/logs dbt/profiles.yml

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 17 for Spark
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "17.0.21+9"

      - name: Set up Python 3.14 (matches the local project venv)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.4"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime requirements and pytest
        run: |
          set -euo pipefail

          python -m pip install -r requirements.txt
          python -m pip install "$(grep -E '^pytest==' requirements-dev.txt)"
          python -m pytest --version
          java -version

      - name: Unit tests with the machine in UTC
        env:
          TZ: UTC
        run: |
          python -m pytest tests/unit -p no:cacheprovider

      - name: Unit tests with the machine in Asia/Kolkata
        env:
          TZ: Asia/Kolkata
        run: |
          python -m pytest tests/unit -p no:cacheprovider

  powerbi-assets:
    name: Power BI artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.4"

      - name: Validate Power BI exports, manifest, docs, and screenshots
        run: |
          python scripts/validate_powerbi_assets.py

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"

      - name: Validate Terraform project exists
        run: |
          set -euo pipefail

          test -d terraform/aws-bi-exports
          test -s terraform/aws-bi-exports/main.tf
          test -s terraform/aws-bi-exports/variables.tf
          test -s terraform/aws-bi-exports/outputs.tf
          test -s terraform/aws-bi-exports/terraform.tfvars.example

      - name: Ensure sensitive Terraform runtime files are not tracked
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)(terraform\.tfvars|.*\.tfstate|.*\.tfstate\.backup|tfplan)$'; then
            echo "Sensitive Terraform runtime file is tracked. Remove it from Git."
            exit 1
          fi

      - name: Terraform format check
        run: |
          terraform fmt -check -recursive terraform

      - name: Terraform init without backend
        working-directory: terraform/aws-bi-exports
        run: |
          terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/aws-bi-exports
        run: |
          terraform validate
