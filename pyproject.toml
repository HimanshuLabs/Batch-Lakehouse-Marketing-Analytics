[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostgreSQL warehouse and the full pipeline (tests/integration)",
]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
extend-exclude = ["venv", "venv-airflow", "venv-dbt", "data", "logs", "dbt/target"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
