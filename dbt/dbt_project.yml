name: marketing_lakehouse_warehouse
version: "1.0.0"
config-version: 2

profile: marketing_lakehouse_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# The read-only role p2_reader (sql/warehouse/create_schemas.sql) reads every
# dbt model: SELECT on each model, and USAGE on the schemas dbt creates.
on-run-end:
  - "{% for schema in schemas %}grant usage on schema {{ schema }} to p2_reader;{% endfor %}"

models:
  marketing_lakehouse_warehouse:
    +persist_docs:
      relation: true
      columns: true
    +grants:
      select: ["p2_reader"]

    staging:
      +materialized: view
      +schema: dbt_staging
      +tags: ["staging", "contract"]

    warehouse:
      +materialized: view
      +schema: dbt_warehouse
      +tags: ["warehouse", "star_schema"]

    marts:
      +materialized: view
      +schema: dbt_marts
      +tags: ["marts", "reporting", "bi"]

    audit:
      +materialized: view
      +schema: dbt_audit
      +tags: ["audit", "reconciliation", "quality"]
