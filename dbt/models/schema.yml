version: 2

sources:
  - name: warehouse_staging
    description: "PostgreSQL staging schema loaded from Project 2 Gold and SCD2 lakehouse outputs."
    schema: staging
    tables:
      - name: stg_gold_dim_customers_scd2
        description: "Customer SCD2 staging table loaded from lakehouse Gold."
      - name: stg_gold_dim_products_scd2
        description: "Product SCD2 staging table loaded from lakehouse Gold."
      - name: stg_gold_dim_campaigns_scd2
        description: "Campaign SCD2 staging table loaded from lakehouse Gold."
      - name: stg_gold_fact_orders_scd2
        description: "Orders fact staging table with point-in-time SCD2 context."
      - name: stg_gold_fact_order_items_scd2
        description: "Order items fact staging table with point-in-time SCD2 context."
      - name: stg_gold_fact_campaign_spend_scd2
        description: "Campaign spend fact staging table with campaign SCD2 context."
      - name: stg_gold_fact_web_events
        description: "Web events fact staging table loaded from lakehouse Gold."

  - name: warehouse_core
    description: "Production PostgreSQL warehouse schema containing star-schema dimensions and facts."
    schema: warehouse
    tables:
      - name: dim_customer
      - name: dim_product
      - name: dim_campaign
      - name: dim_date
      - name: fact_orders
      - name: fact_order_items
      - name: fact_campaign_spend
      - name: fact_web_events

  - name: reporting_marts
    description: "BI-ready reporting marts consumed by dashboard query packs and reporting tools."
    schema: marts
    tables:
      - name: mart_customer_360
      - name: mart_campaign_performance
      - name: mart_product_sales
      - name: mart_revenue_daily
      - name: mart_marketing_funnel
      - name: mart_customer_daily_snapshot
      - name: mart_product_daily_snapshot
      - name: mart_campaign_daily_snapshot

  - name: warehouse_audit
    description: "Audit schema containing reconciliation and warehouse trust checks."
    schema: audit
    tables:
      - name: reconciliation_report

models:
  - name: stg_customers
    description: "dbt staging view over customer SCD2 Gold output loaded into PostgreSQL."
    columns:
      - name: customer_sk
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: is_current
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: stg_products
    description: "dbt staging view over product SCD2 Gold output loaded into PostgreSQL."
    columns:
      - name: product_sk
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null
      - name: is_current
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: stg_campaigns
    description: "dbt staging view over campaign SCD2 Gold output loaded into PostgreSQL."
    columns:
      - name: campaign_sk
        tests:
          - not_null
          - unique
      - name: campaign_id
        tests:
          - not_null
      - name: is_current
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: stg_orders
    description: "dbt staging view over SCD2-aware orders fact output."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_sk
        tests:
          - not_null

  - name: stg_order_items
    description: "dbt staging view over SCD2-aware order item fact output."
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null

  - name: stg_ad_spend
    description: "dbt staging view over SCD2-aware campaign spend fact output."
    columns:
      - name: spend_id
        tests:
          - not_null
          - unique
      - name: campaign_sk
        tests:
          - not_null

  - name: stg_web_events
    description: "dbt staging view over web event facts loaded from lakehouse Gold."
    columns:
      - name: event_id
        tests:
          - not_null
          - unique

  - name: dim_customer
    description: "Customer dimension with surrogate keys. Each attribute is SCD Type 0 (signup_date), Type 1 (name, email, gender, age, language, points, prime flag) or Type 2 (city, state, country, segment, tier); only a Type 2 change opens a version."
    columns:
      - name: signup_date
        description: "SCD Type 0 (fixed): the first signup date the source delivered; a later change is ignored and counted."
      - name: email
        description: "SCD Type 1 (overwrite): the latest email on every version; a change opens no version."
      - name: customer_name
        description: "SCD Type 1 (overwrite): the latest name on every version."
      - name: loyalty_points
        description: "SCD Type 1 (overwrite): the current balance on every version; its history is the tier."
      - name: membership_tier
        description: "SCD Type 2 (history): a change closes the current version and opens a new one."
      - name: customer_segment
        description: "SCD Type 2 (history): the segment the customer was in during the version."
      - name: home_city
        description: "SCD Type 2 (history): a move opens a new version; home_state and country change with it."
      - name: customer_sk
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: is_current
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: dim_product
    description: "Product dimension with surrogate keys. Each attribute is SCD Type 0 (category), Type 1 (name, brand, list price, inventory) or Type 2 (selling price, status); only a Type 2 change opens a version."
    columns:
      - name: category
        description: "SCD Type 0 (fixed): a product stays in the category it was first listed in."
      - name: product_name
        description: "SCD Type 1 (overwrite): the current name on every version."
      - name: inventory_remaining
        description: "SCD Type 1 (overwrite): the latest stock level on every version."
      - name: original_price
        description: "List price in Indian rupees (INR)."
      - name: current_price
        description: "Selling price after the discount, in Indian rupees (INR)."
      - name: product_sk
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null
      - name: brand
        tests:
          - not_null
      - name: product_status
        tests:
          # From the source; the unknown and invalid-reference members carry their label.
          - accepted_values:
              arguments:
                values: ['active', 'discontinued', 'Unknown', 'Invalid reference']
      - name: is_current
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: dim_campaign
    description: "Campaign dimension with surrogate keys. Each attribute is SCD Type 0 (channel, objective), Type 1 (name, A/B group) or Type 2 (target segment, budget, status, start and end date); only a Type 2 change opens a version."
    columns:
      - name: channel
        description: "SCD Type 0 (fixed): the channel the campaign was created for."
      - name: campaign_name
        description: "SCD Type 1 (overwrite): the current name on every version."
      - name: campaign_status
        description: "SCD Type 2 (history): planned, active, paused and completed periods are versions."
      - name: budget
        description: "Lifetime budget of the campaign in Indian rupees (INR)."
      - name: campaign_sk
        tests:
          - not_null
          - unique
      - name: campaign_id
        tests:
          - not_null
      - name: campaign_type
        tests:
          # The campaign's objective, from the source.
          - accepted_values:
              arguments:
                values: ['awareness', 'consideration', 'conversion', 'retention', 'Unknown', 'Invalid reference']
      - name: is_current
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: dim_date
    description: "Calendar dimension used by daily revenue and time-series reporting."
    columns:
      - name: date_sk
        tests:
          - not_null
          - unique

  - name: fact_orders
    description: "Order fact table joined to the correct customer/product/campaign historical dimension versions."
    columns:
      - name: gross_amount
        description: "Order value at list prices in Indian rupees (INR)."
      - name: discount_amount
        description: "Discount on the order in Indian rupees (INR)."
      - name: net_revenue
        description: "Net order value (the sum of the lines) in Indian rupees (INR)."
      - name: tax_amount
        description: "Tax on the order in Indian rupees (INR)."
      - name: shipping_amount
        description: "Shipping fee in Indian rupees (INR)."
      - name: refund_amount
        description: "Amount refunded for a returned order in Indian rupees (INR)."
      - name: order_id
        tests:
          - not_null
          - unique
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled', 'returned']
      - name: total_amount
        description: "What the customer was charged: net + tax + shipping, in Indian rupees (INR)."
        tests:
          - not_null
      - name: customer_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk

  - name: fact_order_items
    description: "Order item fact table for product-level sales analytics."
    columns:
      - name: unit_price
        description: "Selling price of one unit in Indian rupees (INR)."
      - name: gross_amount
        description: "Line value at list price in Indian rupees (INR)."
      - name: discount_amount
        description: "Discount on the line in Indian rupees (INR)."
      - name: line_revenue
        description: "Net line value in Indian rupees (INR)."
      - name: refund_amount
        description: "The line's share of the order's refund in Indian rupees (INR)."
      - name: order_item_nk
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sk

  - name: fact_campaign_spend
    description: "Campaign spend fact table for ROAS and marketing efficiency analytics."
    columns:
      - name: spend_amount
        description: "Ad spend of the campaign, day and region in Indian rupees (INR)."
      - name: attributed_revenue
        description: "Revenue the ad platform attributes to that spend in Indian rupees (INR)."
      - name: campaign_spend_nk
        tests:
          - not_null
          - unique
      - name: conversions
        tests:
          - not_null
      - name: campaign_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_sk

  - name: fact_web_events
    description: "Web behavior fact table used for funnel and engagement reporting."
    columns:
      - name: event_value
        description: "Value of the cart at the event in Indian rupees (INR)."
      - name: event_id
        tests:
          - not_null
          - unique

  - name: mart_customer_360
    description: "Customer-level BI mart for customer value, orders, engagement, and segmentation."
    columns:
      - name: lifetime_value
        description: "net_sales less refund_amount in Indian rupees (INR)."
      - name: net_sales
        description: "Net value of the customer's orders that were not cancelled in Indian rupees (INR)."
      - name: refund_amount
        description: "Refunds to the customer in Indian rupees (INR)."
      - name: average_order_value
        description: "Average net order value in Indian rupees (INR)."
      - name: customer_id
        tests:
          - not_null

  - name: mart_campaign_performance
    description: "Campaign-level BI mart for spend, revenue, ROAS, and conversion performance."
    columns:
      - name: campaign_budget
        description: "Lifetime budget in Indian rupees (INR)."
      - name: total_spend
        description: "Ad spend in Indian rupees (INR)."
      - name: attributed_revenue
        description: "net_sales less refund_amount of the campaign's orders in Indian rupees (INR)."
      - name: platform_attributed_revenue
        description: "Revenue the ad platform attributes to the campaign in Indian rupees (INR)."
      - name: campaign_id
        tests:
          - not_null

  - name: mart_product_sales
    description: "Product-level BI mart for units, revenue, and category performance."
    columns:
      - name: product_revenue
        description: "net_sales less refund_amount in Indian rupees (INR)."
      - name: original_price
        description: "List price in Indian rupees (INR)."
      - name: current_price
        description: "Selling price in Indian rupees (INR)."
      - name: product_id
        tests:
          - not_null

  - name: mart_revenue_daily
    description: "Daily revenue BI mart for trend reporting."
    columns:
      - name: gross_revenue
        description: "Sales at list prices in Indian rupees (INR)."
      - name: discount_amount
        description: "Discounts in Indian rupees (INR)."
      - name: net_revenue
        description: "Net sales of the orders placed that day and not cancelled in Indian rupees (INR)."
      - name: refund_amount
        description: "Refunds of the returns of that day in Indian rupees (INR)."
      - name: net_revenue_after_refunds
        description: "net_revenue less refund_amount in Indian rupees (INR)."
      - name: total_amount
        description: "What customers were charged (net + tax + shipping) in Indian rupees (INR)."
      - name: revenue_date
        tests:
          - not_null

  - name: mart_customer_daily_snapshot
    description: "mart_customer_360 as of the end of each business date, from each customer's first activity: computed only from what was known on that date."
    columns:
      - name: lifetime_value
        description: "net_sales less refund_amount as of snapshot_date in Indian rupees (INR)."
      - name: snapshot_date
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: mart_product_daily_snapshot
    description: "mart_product_sales as of the end of each business date, from each product's first activity: computed only from what was known on that date."
    columns:
      - name: product_revenue
        description: "net_sales less refund_amount as of snapshot_date in Indian rupees (INR)."
      - name: snapshot_date
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: mart_campaign_daily_snapshot
    description: "mart_campaign_performance as of the end of each business date, from each campaign's first activity: computed only from what was known on that date."
    columns:
      - name: total_spend
        description: "Ad spend up to snapshot_date in Indian rupees (INR)."
      - name: attributed_revenue
        description: "net_sales less refund_amount as of snapshot_date in Indian rupees (INR)."
      - name: snapshot_date
        tests:
          - not_null
      - name: campaign_id
        tests:
          - not_null

  - name: mart_marketing_funnel
    description: "Marketing funnel BI mart for impressions, engagement, conversion, and purchase behavior."
    columns:
      - name: event_date
        tests:
          - not_null
      - name: channel_name
        tests:
          - not_null
      - name: channel_group
        tests:
          # The unknown channel is 'Unknown': the one display label for unknown members.
          - accepted_values:
              arguments:
                values: ['Search', 'Social', 'Email', 'Direct', 'Other', 'Unknown']
      - name: campaign_id
        tests:
          - not_null

  - name: reconciliation_report
    description: "dbt audit view exposing source-to-warehouse reconciliation status."
    columns:
      - name: check_name
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          # Every reconciliation check must pass; a FAIL or WARN fails dbt test.
          - accepted_values:
              arguments:
                values: ['PASS']
